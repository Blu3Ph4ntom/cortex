[workspace]
members = [
    "crates/cortex-cli",
    "crates/cortex-core",
    "crates/cortex-daemon",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["blu3ph4ntom"]
repository = "https://github.com/blu3ph4ntom/cortex"
homepage = "https://cortex.bluephantom.dev"
documentation = "https://cortex.bluephantom.dev/docs/"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["json", "macros"] }
clap = { version = "4.5.53", features = ["derive"] }
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sled = "0.34.7"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-language = "0.1.5"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
walkdir = "2.5.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
