[workspace]
members = [
    "crates/cortex-cli",
    "crates/cortex-core",
    "crates/cortex-daemon",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.1"
authors = ["blu3ph4ntom"]
repository = "https://github.com/blu3ph4ntom/cortex"
homepage = "https://blu3ph4ntom.github.io/cortex/"
documentation = "https://blu3ph4ntom.github.io/cortex/#quickstart"

[workspace.dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.6", features = ["json", "macros"] }
clap = { version = "4.5.53", features = ["derive"] }
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sled = "0.34.7"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
sysinfo = "0.30.12"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-clojure = "0.1.0"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-dart = "0.1.0"
tree-sitter-elixir = "0.3.4"
tree-sitter-erlang = "0.15.0"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-julia = "0.23.1"
tree-sitter-kotlin-codanna = "0.3.9"
tree-sitter-language = "0.1.5"
tree-sitter-lua = "0.2.0"
tree-sitter-objc = "3.0.2"
tree-sitter-ocaml = "0.23.2"
tree-sitter-php = "0.23.11"
tree-sitter-python = "0.25.0"
tree-sitter-r = "1.2.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-scala = "0.23.2"
tree-sitter-swift = "0.6.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
walkdir = "2.5.0"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
