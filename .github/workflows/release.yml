name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x86_64
          - os: macos-13
            artifact_suffix: macos-x86_64
          - os: macos-14
            artifact_suffix: macos-aarch64
          - os: windows-latest
            artifact_suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build binaries
        run: cargo build --release -p cortex-cli -p cortex-daemon
      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp target/release/cortex dist/
          cp target/release/cortexd dist/
          tar -czf cortex-${{ matrix.artifact_suffix }}.tar.gz -C dist cortex cortexd
      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/cortex.exe dist/
          Copy-Item target/release/cortexd.exe dist/
          Compress-Archive -Path dist/cortex.exe,dist/cortexd.exe -DestinationPath cortex-${{ matrix.artifact_suffix }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ matrix.artifact_suffix }}
          path: |
            *.tar.gz
            *.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
