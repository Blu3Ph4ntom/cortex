{% extends "base.html" %}

{% block content %}
<main class="docs-wrap shell">
  <aside class="docs-sidebar">
    <p class="eyebrow">Documentation</p>
    {% set docs = get_section(path="docs/_index.md") %}
    <nav class="docs-nav">
      {% for child in docs.pages %}
        <a href="{{ child.permalink }}" class="doc-link {% if page.title == child.title %}active{% endif %}">{{ child.title }}</a>
      {% endfor %}
    </nav>
  </aside>
  <article class="prose docs-article">
    <p class="eyebrow">{{ page.title }}</p>
    <h1>{{ page.title }}</h1>
    {{ page.content | safe }}
  </article>
</main>
{% endblock content %}
