{% extends "base.html" %}

{% block content %}
<main class="shell docs-shell">
  <aside class="glass-panel docs-nav">
    <p class="label">Docs</p>
    {% set docs = get_section(path="docs/_index.md") %}
    {% for child in docs.pages %}
      <a href="{{ child.permalink }}" class="doc-link {% if page.title == child.title %}active{% endif %}">{{ child.title }}</a>
    {% endfor %}
  </aside>
  <article class="glass-panel prose">
    <p class="label">{{ page.title }}</p>
    <h1>{{ page.title }}</h1>
    {{ page.content | safe }}
  </article>
</main>
{% endblock content %}
