<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page and page.title %}{{ page.title }} | {% endif %}{{ config.title }}</title>
  <meta name="description" content="{{ config.description }}">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="shell topbar">
      <a class="brand" href="{{ get_url(path='') }}">Cortex</a>
      <nav class="nav">
        <a href="{{ get_url(path='') }}">Overview</a>
        <a href="{{ get_url(path='docs/') }}">Docs</a>
        <a href="{{ config.extra.repo }}">GitHub</a>
      </nav>
    </div>
  </header>
  {% block content %}{% endblock content %}
  <footer class="site-footer">
    <div class="shell footer-inner">
      <p class="footer-brand">Cortex</p>
      <div class="footer-links">
        <a href="{{ get_url(path='docs/getting-started/') }}">Getting Started</a>
        <a href="{{ get_url(path='docs/queries/') }}">Queries</a>
        <a href="{{ get_url(path='docs/architecture/') }}">Architecture</a>
        <a href="{{ config.extra.repo }}">GitHub</a>
      </div>
    </div>
  </footer>
</body>
</html>
